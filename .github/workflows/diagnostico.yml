name: Diagnóstico de funciones

on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/diagnostico.yml']

jobs:
  revisar:
    runs-on: ubuntu-latest
    env:
      PROYECTO: ebptech-app
      REGION: southamerica-east1
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Respuesta de la función sin sesión
        run: |
          curl -sS -m 30 -X POST -H 'Content-Type: application/json' -d '{"data":{}}' \
            -w '\nHTTP %{http_code}\n' "https://$REGION-$PROYECTO.cloudfunctions.net/driveListar" || true
      - name: Quién puede llamar a driveListar
        run: gcloud run services get-iam-policy drivelistar --region "$REGION" --project "$PROYECTO" || true
      - name: APIs activas
        run: gcloud services list --enabled --project "$PROYECTO" --format='value(config.name)' | grep -Ei 'drive|run|functions' || true
      - name: Últimos registros de driveListar
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="drivelistar" AND severity>=WARNING' \
            --project "$PROYECTO" --freshness=1d --limit 30 \
            --format='table(timestamp, severity, textPayload, jsonPayload.message)' || true
